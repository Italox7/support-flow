name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres descartável: testes e migrations nunca tocam no Supabase.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: support_flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/support_flow?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/support_flow?schema=public

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Scripts de instalação de dependências não rodam no CI; os passos que
      # precisamos (build do shared, prisma generate) rodam explicitamente abaixo.
      - run: npm ci --ignore-scripts
      - run: npm run build -w @support-flow/shared
      - run: npx prisma generate
        working-directory: apps/api

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

      - name: Aplicar migrations num banco limpo
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Falhar se o schema.prisma mudou sem migration
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        working-directory: apps/api

      - run: npm test

      - run: npm run build
