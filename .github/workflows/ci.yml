name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres descartável: testes e migrations nunca tocam no Supabase.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: support_flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/support_flow?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/support_flow?schema=public
      # Habilita os testes E2E, que apagam as tabelas entre um teste e outro.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/support_flow?schema=public

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Scripts de instalação de dependências não rodam no CI; os passos que
      # precisamos (build do shared, prisma generate) rodam explicitamente abaixo.
      - run: npm ci --ignore-scripts
      - run: npm run build -w @support-flow/shared
      - run: npx prisma generate
        working-directory: apps/api

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

      - name: Aplicar migrations num banco limpo
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Falhar se o schema.prisma mudou sem migration
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        working-directory: apps/api

      - run: npm test

      - run: npm run build

      - name: A guarda de deploy recusa o ambiente errado e aceita o certo
        env:
          JWT_ACCESS_SECRET: ci-smoke-secret-with-more-than-32-characters
          JOBS_SECRET: ci-smoke-jobs-secret-with-more-than-32-chars
          TRUST_PROXY: '1'
        run: |
          if node apps/api/dist/check-deploy-env.js; then
            echo "A guarda aceitou uma URL sem sslmode."
            exit 1
          fi
          DATABASE_URL='postgresql://u:p@pooler.example.com:6543/postgres?schema=public&sslmode=verify-full&sslrootcert=certs/supabase-ca.crt' \
          DIRECT_URL='postgresql://u:p@pooler.example.com:5432/postgres?schema=public&sslmode=require' \
            node apps/api/dist/check-deploy-env.js

      - name: Subir o build e checar os dois health
        working-directory: apps/api
        env:
          JWT_ACCESS_SECRET: ci-smoke-secret-with-more-than-32-characters
        run: |
          node dist/main.js &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for _ in $(seq 1 30); do
            curl --silent --fail http://localhost:3000/api/health/live >/dev/null && break
            sleep 1
          done
          curl --silent --show-error --fail http://localhost:3000/api/health/live | grep -q '"status":"ok"'
          curl --silent --show-error --fail http://localhost:3000/api/health | grep -q '"status":"ok"'
